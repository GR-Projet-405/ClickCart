# Container configuration. Secrets are supplied by the hosting environment.
spring:
  application:
    name: clickcart-backend
  main:
    allow-bean-definition-overriding: true
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${DATABASE_NAME}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

server:
  forward-headers-strategy: framework
  port: ${PORT:10000}

AUTH_RESET_CODE_DELIVERY: email
AUTH_RESET_MAIL_FROM: ${MAIL_FROM}

clickcart:
  mail:
    provider: brevo
  attachments:
    dir: ${ATTACHMENTS_DIR:/app/data/attachments}
  security:
    enabled: true
    external-jwt-enabled: false
    issuer-uri: ${JWT_ISSUER_URI:}
    audience: ${JWT_AUDIENCE:clickcart}
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${CLICKCART_JWT_TTL:900}
  upload:
    proof-dir: ${CLICKCART_PROOF_DIR:/app/data/proofs}

# Cloudinary Settings
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

logging:
  level:
    org.springframework.data.mongodb: WARN
    com.clickcart: INFO

# Gemini AI Settings
gemini:
  api:
    key: ${GEMINI_API_KEY}
