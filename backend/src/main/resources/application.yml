spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: clickcart-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/clickcart}

server:
  port: ${SERVER_PORT:8080}

clickcart:
  security:
    enabled: ${CLICKCART_SECURITY_ENABLED:false}
logging:
  level:
    org.springframework.data.mongodb: DEBUG
    com.clickcart: DEBUG
