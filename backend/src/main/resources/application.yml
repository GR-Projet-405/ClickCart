spring:
  application:
    name: clickcart-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/clickcart}

server:
  port: ${SERVER_PORT:8080}

clickcart:
  security:
    enabled: ${CLICKCART_SECURITY_ENABLED:false}
    issuer-uri: ${JWT_ISSUER_URI:}
    audience: ${JWT_AUDIENCE:clickcart}

