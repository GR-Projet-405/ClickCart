spring:
  application:
    name: clickcart-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/clickcart}
      database: ${MONGODB_DATABASE:clickcart}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.data.mongodb: DEBUG
    com.clickcart: DEBUG
